<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="kaloli: a Telegram bot that estimates calories from meal photos" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#12211a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6f135" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#c6f135" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="250" cy="180" r="230" fill="url(#glow)"/>

  <!-- plate -->
  <g transform="translate(250 180)">
    <circle r="118" fill="#ece7dc"/>
    <circle r="92" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/>
    <ellipse cx="-20" cy="28" rx="50" ry="32" fill="#f6e7bd"/>
    <g fill="#e9d59c">
      <circle cx="-44" cy="24" r="3"/><circle cx="-26" cy="38" r="3"/><circle cx="-6" cy="22" r="3"/>
      <circle cx="-30" cy="14" r="3"/><circle cx="6" cy="40" r="3"/><circle cx="-52" cy="38" r="3"/>
    </g>
    <g transform="rotate(-16 36 -18)">
      <rect x="2" y="-46" width="74" height="42" rx="20" fill="#d9984a"/>
      <path d="M20 -40 l-9 30 M38 -42 l-9 34 M56 -42 l-9 34" stroke="#8c5a28" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
    <circle cx="-46" cy="-34" r="22" fill="#57a845"/>
    <circle cx="-22" cy="-52" r="17" fill="#79c458"/>
    <circle cx="-62" cy="-12" r="13" fill="#44923a"/>
    <circle cx="-32" cy="-26" r="9" fill="#e4513b"/>
    <circle cx="-56" cy="-46" r="7" fill="#e4513b"/>
  </g>

  <!-- scan frame -->
  <g fill="none" stroke="#c6f135" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 80 v-32 h32"/>
    <path d="M392 80 v-32 h-32"/>
    <path d="M108 280 v32 h32"/>
    <path d="M392 280 v32 h-32"/>
  </g>

  <!-- estimate tag -->
  <rect x="318" y="254" width="156" height="48" rx="24" fill="#c6f135"/>
  <text x="396" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#0b1016">~596 kcal</text>

  <!-- wordmark -->
  <text x="556" y="166" font-size="100" font-weight="800" fill="#f4f6f8" letter-spacing="-3">kaloli</text>
  <text x="560" y="212" font-size="24" fill="#a9b4c2">Snap your meal. Tag the bot. Get the calories.</text>

  <g font-size="16" font-weight="600" fill="#d7dee7" text-anchor="middle">
    <rect x="560" y="244" width="118" height="36" rx="18" fill="#1b2630" stroke="#2c3a47"/>
    <text x="619" y="267">Telegram</text>
    <rect x="690" y="244" width="126" height="36" rx="18" fill="#1b2630" stroke="#2c3a47"/>
    <text x="753" y="267">Vision LLM</text>
    <rect x="828" y="244" width="96" height="36" rx="18" fill="#1b2630" stroke="#2c3a47"/>
    <text x="876" y="267">SQLite</text>
    <rect x="936" y="244" width="150" height="36" rx="18" fill="#1b2630" stroke="#2c3a47"/>
    <text x="1011" y="267">Bun, zero deps</text>
  </g>
</svg>
