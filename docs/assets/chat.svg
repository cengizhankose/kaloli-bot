<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 664" width="760" height="664" role="img" aria-label="Illustration of a group chat: a member posts a meal photo tagging the bot, and the bot replies with a per-item calorie breakdown" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="664" rx="20" fill="#0e1621"/>

  <!-- header -->
  <path d="M0 20 a20 20 0 0 1 20 -20 h720 a20 20 0 0 1 20 20 v44 h-760 z" fill="#17212b"/>
  <circle cx="44" cy="32" r="20" fill="#c6f135"/>
  <text x="44" y="39" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1016">k</text>
  <text x="78" y="28" font-size="17" font-weight="700" fill="#f4f6f8">Kaloli</text>
  <text x="78" y="48" font-size="13" fill="#6d7f8f">5 members</text>

  <!-- member message: photo + caption -->
  <circle cx="36" cy="326" r="16" fill="#e17076"/>
  <text x="36" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">M</text>
  <rect x="64" y="84" width="300" height="258" rx="14" fill="#182533"/>
  <text x="78" y="106" font-size="14" font-weight="700" fill="#e17076">Mert</text>
  <rect x="72" y="116" width="284" height="180" rx="10" fill="#3a2f26"/>
  <g transform="translate(214 206) scale(0.62)">
    <circle r="118" fill="#ece7dc"/>
    <circle r="92" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/>
    <ellipse cx="-20" cy="28" rx="50" ry="32" fill="#f6e7bd"/>
    <g transform="rotate(-16 36 -18)">
      <rect x="2" y="-46" width="74" height="42" rx="20" fill="#d9984a"/>
      <path d="M20 -40 l-9 30 M38 -42 l-9 34 M56 -42 l-9 34" stroke="#8c5a28" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
    <circle cx="-46" cy="-34" r="22" fill="#57a845"/>
    <circle cx="-22" cy="-52" r="17" fill="#79c458"/>
    <circle cx="-62" cy="-12" r="13" fill="#44923a"/>
    <circle cx="-32" cy="-26" r="9" fill="#e4513b"/>
  </g>
  <text x="78" y="322" font-size="15" fill="#6ab3f3">@kaloli_bot</text>
  <text x="352" y="332" text-anchor="end" font-size="12" fill="#6d7f8f">12:40</text>

  <!-- bot reply -->
  <circle cx="36" cy="630" r="16" fill="#c6f135"/>
  <text x="36" y="635" text-anchor="middle" font-size="15" font-weight="800" fill="#0b1016">k</text>
  <rect x="64" y="358" width="452" height="288" rx="14" fill="#182533"/>
  <text x="78" y="381" font-size="14" font-weight="700" fill="#c6f135">kaloli</text>
  <rect x="126" y="369" width="32" height="16" rx="4" fill="#2b3a49"/>
  <text x="142" y="381" text-anchor="middle" font-size="11" fill="#9fb0c0">bot</text>
  <rect x="78" y="392" width="3" height="38" rx="1.5" fill="#6ab3f3"/>
  <text x="90" y="407" font-size="13" font-weight="600" fill="#6ab3f3">Mert</text>
  <text x="90" y="425" font-size="13" fill="#8a99a8">Photo</text>

  <g font-size="15" fill="#e6ebf0">
    <text x="78" y="456" font-weight="700">Tavuklu pilav · ~596 kcal</text>
    <text x="90" y="480">• Pirinç pilavı 200 g — 260 kcal</text>
    <text x="90" y="504">• Izgara tavuk 150 g — 248 kcal</text>
    <text x="90" y="528">• Zeytinyağı 10 g — 88 kcal</text>
    <text x="78" y="552">P 51 g · K 56 g · Y 17 g</text>
    <text x="78" y="576">Güven: orta</text>
    <text x="78" y="600">Varsayım: Tipik bir lokanta porsiyonu varsayıldı.</text>
    <text x="78" y="624">Mert · bugün toplam 596 kcal</text>
  </g>
  <text x="504" y="638" text-anchor="end" font-size="12" fill="#6d7f8f">12:40</text>
</svg>
